id = "lib-rate-limiter"
angle = "time-semantics"
outcome = "For a bucket of a given capacity and refill rate driven by an injected clock, each allow(cost) call returns True or False exactly as the elapsed clock time, the ceiling, and the running token count dictate."
target = "target/token_bucket.py"
evidence = ["evidence/spec.md", "evidence/usage.md"]
probe = "uv run --no-project python probe.py target/token_bucket.py"
bound = "one benchmark run finishes in under 5 s wall clock in a single process; no network, no installs, no dependency beyond the standard library; no case may sleep or otherwise wait on real time; at most 25 cases."
expected_qualification = ["discrimination", "reproducibility", "cost-within-bound", "schema-valid"]
negative = false
port = "paths are case-relative and the probe is cwd-tolerant (case directory or repository root); an adapter may swap the implementation by appending `seeds/<slug>` or `seeds/<slug>/token_bucket.py` to `probe`, by setting CASE_IMPL to either, or by substituting the `target` value inside `probe` — `target` and `seeds/good-alt` exit 0, every `seeds/bad-*` exits non-zero."
