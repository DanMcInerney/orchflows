id = "cli-dedupe"
angle = "deterministic-cli"
outcome = "Given a text stream and the flags --window N and --ignore-case, the command writes exactly the retained lines, in input order, byte for byte, and exits 0 — or exits 2 on a usage error."
target = "target/dedupe.py"
evidence = ["evidence/spec.md", "evidence/CHANGELOG.md"]
probe = "uv run --no-project python probe.py target/dedupe.py"
bound = "one benchmark run finishes in under 10 s wall clock in a single process on one core; no network, no installs, no dependency beyond the standard library; at most 25 cases."
expected_qualification = ["discrimination", "reproducibility", "cost-within-bound", "schema-valid"]
negative = false
port = "paths are case-relative and the probe is cwd-tolerant (case directory or repository root); an adapter may swap the implementation by appending `seeds/<slug>` or `seeds/<slug>/dedupe.py` to `probe`, by setting CASE_IMPL to either, or by substituting the `target` value inside `probe` — `target` and `seeds/good-alt` exit 0, every `seeds/bad-*` exits non-zero."
