id = "nondeterministic-target"
angle = "nondeterminism"
outcome = """
Given a pinned seed and a draw count, sampler.py returns that many \
shard ids, weighted by capacity and identical on every rerun of the \
same seed."""
target = "target/sampler.py"
evidence = ["evidence/sampler-notes.md", "evidence/ops-runbook.md"]
probe = 'uv run --no-project python -c "import sys,os;sys.path.insert(0,os.path.dirname(sys.argv[1]));import sampler as s;a=s.draw(7,12);assert a==[1,0,2,0,1,1,0,1,0,1,0,0],a;b=s.draw(7,12);assert b==a,b;c=s.draw(11,20000).count(0);assert 5700<c<6300,c" {target}'
bound = """
one process per case, at most 12 cases, under 10 s wall clock for the \
whole benchmark run; the distributional case is capped at 20,000 \
draws; no network, no fixtures."""
expected_qualification = [
    "discrimination",
    "reproducibility",
    "cost-within-bound",
    "schema-valid",
]
negative = false
port = """
cwd is this case directory; substitute {target} in probe with the \
implementation under test — target/sampler.py for the reference, \
seeds/<seed>/sampler.py for a seed — then run it: exit 0 is PASS, \
non-zero is FAIL, target and seeds/good-cumulative must exit 0 and \
every seeds/bad-* must exit non-zero; the probe pins seeds 7 and 11, \
which appear nowhere in evidence/, and its distributional band is \
5700 < count of shard 0 in 20000 draws < 6300."""
