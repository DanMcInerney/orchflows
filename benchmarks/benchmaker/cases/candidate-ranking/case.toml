id = "candidate-ranking"
angle = "ranking"
outcome = "Given a weights file fixed before any candidate is seen and one result record per candidate, the command writes the ranking — competition-style ranks with explicit ties, adjacent margins, required-failure candidates excluded — byte for byte with LF endings and exits 0, or exits 2 with empty stdout on a usage error."
target = "target/rank.py"
evidence = ["evidence/spec.md", "evidence/records"]
probe = "uv run --no-project python probe.py target/rank.py"
bound = "one benchmark run finishes in under 10 s wall clock in a single process on one core; no network, no installs, no dependency beyond the standard library; at most 25 cases."
expected_qualification = ["discrimination", "reproducibility", "cost-within-bound", "schema-valid"]
negative = false
port = "paths are case-relative and the probe is cwd-tolerant (case directory or repository root); an adapter may swap the implementation by appending `seeds/<slug>` or `seeds/<slug>/rank.py` to `probe`, by setting CASE_IMPL to either, or by substituting the `target` value inside `probe` — `target` and `seeds/good-alt` exit 0, every `seeds/bad-*` exits non-zero."
tests = "Benchmark of a multi-candidate ranker proves total order with explicit ties, declared margins, required-failure exclusion, and candidate-blind aggregation."
size = "small"
provenance = "expected.md"
parallel_safe = true
