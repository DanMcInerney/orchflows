<!--
  The same appliance signature with an uppercase tag. HTML tag and attribute
  names are case-insensitive, so an appliance emitting this is emitting the
  measured marker.
-->
<HTML>
<HEAD>
<BASE HREF="/login/">
<TITLE>Authentication required</TITLE>
</HEAD>
<BODY>
<P>This request was answered by the local network appliance.</P>
</BODY>
</HTML>
