  <text class="heading" x="448" y="171">Software “builder”</text>
  <text class="label" x="481" y="233" style="text-anchor:start">Defines outcome</text>
  <text class="heading" x="447" y="313" style="font-size:28px">software-factory</text>
  <text class="detail primitive" x="447" y="350">orch-work: fresh builder</text>
  <text class="detail" x="447" y="377">Writes / edits the code</text>

  <text class="heading" x="1027" y="178">Your project + guidance</text>
  <text class="detail" x="869" y="229" style="text-anchor:start">Source code + project documentation</text>
  <text class="detail" x="869" y="254" style="text-anchor:start">Git / PRs + optional connected sources</text>
  <text class="detail primitive" x="869" y="286" style="text-anchor:start">guidance/code.md</text>
  <text class="detail primitive" x="869" y="311" style="text-anchor:start">guidance/software-delivery.md</text>
  <text class="detail" x="869" y="344" style="text-anchor:start">Project CI, deploy, flags + telemetry</text>
  <text class="detail" x="869" y="369" style="text-anchor:start">Resolved context goes to each child</text>
  <text class="label" x="706" y="317">gets context from</text>

  <text class="heading" x="447" y="512">CI: build + test</text>
  <text class="detail" x="447" y="545">Exact candidate + saved patch</text>
  <text class="detail" x="447" y="565">Apply, reconstruct, compare</text>
  <text class="detail" x="447" y="585">Required CI + perf evidence</text>
  <text class="label" x="166" y="429">Fresh builder fixes</text>
  <text class="label" x="166" y="449">check / review issues</text>
  <text class="label" x="166" y="469">within P passes</text>

  <text class="heading" x="1009" y="494" style="font-size:29px">Agentic code review</text>
  <text class="detail primitive" x="1009" y="530">orch-review: fresh reviewers</text>
  <text class="detail" x="1009" y="550">Parallel: correctness + applicable</text>
  <text class="detail" x="1009" y="570">data, infra, cloud and security</text>
  <text class="detail" x="1009" y="590">Join findings + assess risk</text>
  <text class="heading" x="982" y="746" style="font-size:24px">Low risk + opt-in?</text>
  <text x="1200" y="715" style="font-size:26px">No</text>
  <text x="1053" y="870" style="font-size:26px">Yes</text>

  <text class="heading" x="1265" y="832" style="font-size:26px">Human review</text>
  <text class="detail" x="1265" y="870">Exact diff, checks,</text>
  <text class="detail" x="1265" y="893">risk + rollback plan</text>
  <text class="heading" x="1012" y="962">Agentic deploy</text>
  <text class="detail primitive" x="1012" y="995">orch-work: release worker</text>
  <text class="detail" x="1012" y="1017">Only if requested + authorized</text>
  <text class="detail" x="1012" y="1039">Stage, observe; stop / rollback</text>

  <text class="heading" x="465" y="770">Production</text>
  <text class="detail" x="465" y="816">Project signals + release checkpoint</text>
  <text class="detail" x="465" y="839">Exposure, health and recovery</text>
  <text class="detail" x="465" y="874">Uses your observability tools</text>
  <text class="label" x="352" y="974" style="text-anchor:end">Explicit run</text>
  <text class="label" x="352" y="994" style="text-anchor:end">or schedule</text>
  <text class="label" x="656" y="1051" style="text-anchor:end">Incident request</text>
  <text class="label" x="79" y="935" style="text-anchor:start">Proposed fix brief;</text>
  <text class="label" x="79" y="957" style="text-anchor:start">new authorized run</text>

  <text class="heading" x="365" y="1104" style="font-size:21px">observe-production</text>
  <text class="detail primitive" x="365" y="1140">orch-work: one worker</text>
  <text class="detail" x="365" y="1171">Deduplicate signals;</text>
  <text class="detail" x="365" y="1194">propose performance fixes</text>
  <text class="heading" x="677" y="1116" style="font-size:20px">investigate-incident</text>
  <text class="detail primitive" x="677" y="1151">orch-work: one worker</text>
  <text class="detail" x="677" y="1180">Evidence + mitigations</text>
  <text class="detail" x="677" y="1204">Act within authorization</text>

  <text x="1408" y="1193" class="label" style="text-anchor:end">Composing workflows: decisions + routing</text>
  <text x="1408" y="1216" class="label" style="text-anchor:end">Two primitives: fresh work / independent review</text>
  <text x="1408" y="1239" class="label" style="text-anchor:end">Guidance: domain criteria · No bundled scheduler</text>
</svg>
