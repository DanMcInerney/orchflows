<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="1253" viewBox="0 0 1456 1253" role="img" aria-labelledby="title desc">
  <title id="title">The software factory implemented with Orchflows</title>
  <desc id="desc">Matches the layout of Gergely Orosz's OpenAI software factory diagram. The software-factory workflow delegates implementation and release through orch-work and independent reviews through orch-review. Project context and domain guidance supply specifics. Checks and reviews can return to a bounded builder pass. Low risk with explicit project opt-in can satisfy review; other changes need human review. Deployment additionally requires release authority. Production observation and incident investigation are separately invoked workflows using one orch-work child each.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="18" markerHeight="18" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L16 9 L2 16" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    .box { fill: white; stroke: #171717; stroke-width: 3; }
    .edge { fill: none; stroke: #171717; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .feedback { stroke-dasharray: 10 10; }
    text { fill: #171717; font-family: 'Segoe UI', Arial, sans-serif; text-anchor: middle; }
    .heading { font-family: 'Segoe Print', 'Comic Sans MS', cursive; font-size: 31px; font-weight: 600; }
    .detail { font-size: 17px; }
    .label { font-size: 16px; }
    .primitive { font-weight: 600; }
  </style>
  <rect width="1456" height="1253" fill="white"/>
  <text x="728" y="64" class="heading" style="font-size:36px">The software factory, implemented with Orchflows</text>

