<!--
  Fixture: two cards, one of them incomplete.

  LinkedIn omits the time element on some postings rather than sending an
  empty one. A card with no date is still a real job with a real URN, so it is
  kept - and it is marked, and its published time stays absent. Deriving one
  from the read's own moment would make a posting look as fresh as the request
  that found it, which is the quiet kind of wrong that survives review.

  The complete card beside it is the contrast: same page, same parser, one
  marked and one not.
-->

       data-entity-urn="urn:li:jobPosting:3971120011"
