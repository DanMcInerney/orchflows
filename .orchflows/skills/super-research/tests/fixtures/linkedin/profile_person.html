<!--
  Fixture: one public profile page as www.linkedin.com/in/<slug> serves it.

  findings.md 1 (LinkedIn) measured this route at 200, 577 KB, 1.3 s, carrying
  a complete ld+json Person block with name, jobTitle[], addressLocality,
  description, worksFor[] and alumniOf[]. It records that field set; it does
  not record a captured body, and this package may not reach the network to
  make one. So this page carries exactly the shape and field set the evidence
  names and nothing else is claimed for it. The container - an
  application/ld+json script whose @graph holds a node of @type Person - is
  this package's belief about the shape and is unproven here; a wrong one is
  typed schema_drift rather than answered empty, and criterion 12 is what
  proves it.

  The load-bearing part of this fixture is that "Sign in to" and "Join now"
  appear in the markup BESIDE a fully populated block, above it and below it.
  That is the measured finding the prior spec got wrong: it placed LinkedIn
  outside the roster on an assumed 999 authwall, and the strings that look
  like one are navigation chrome. An adapter that reads them is how the false
  negative comes back.

  Two ld+json scripts, because the page really carries several and the Person
  is not always the first: the block is found by the standard's own @type,
  never by position.

  The person is fictional. The slug carries LinkedIn's own name-plus-hash
  vanity form so the route's path segment is the shape the origin serves.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Avery Lindqvist - Northwind Analytics | LinkedIn</title>
<script type="application/ld+json">
{"@context":"http://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"LinkedIn","item":"https://www.linkedin.com"},{"@type":"ListItem","position":2,"name":"Avery Lindqvist"}]}
</script>
</head>
<body>
<nav class="nav">
  <a class="nav__button-tertiary" href="/signup">Join now</a>
  <a class="nav__button-secondary" href="/login">Sign in to view Avery's full profile</a>
</nav>

<script type="application/ld+json">
{
 "@context": "http://schema.org",
 "@graph": [
  {
   "@type": "WebPage",
   "url": "https://www.linkedin.com/in/avery-lindqvist-8a41b207",
   "reviewedBy": {"@type": "Person", "name": "Avery Lindqvist"}
  },
  {
   "@type": "Person",
   "name": "Avery Lindqvist",
   "url": "https://www.linkedin.com/in/avery-lindqvist-8a41b207",
   "jobTitle": ["Principal Reliability Engineer", "Board Advisor"],
   "address": {
    "@type": "PostalAddress",
    "addressLocality": "Gothenburg, Vastra Gotaland County, Sweden",
    "addressCountry": "SE"
   },
   "description": "Reliability and data infrastructure. I spend most of my time on the boring parts of distributed storage, and I write up the outages nobody else wants to.",
   "worksFor": [
    {
     "@type": "Organization",
     "name": "Northwind Analytics",
     "url": "https://www.linkedin.com/company/northwind-analytics"
    },
    {
     "@type": "Organization",
     "name": "Kestrel Systems"
    }
   ],
   "alumniOf": [
    {
     "@type": "EducationalOrganization",
     "name": "Chalmers University of Technology",
     "url": "https://www.linkedin.com/school/chalmers"
    },
    {
     "@type": "EducationalOrganization",
     "name": "Lund University"
    }
   ]
  }
 ]
}
</script>

<main class="profile">
  <section class="top-card-layout">
    <h1 class="top-card-layout__title">Avery Lindqvist</h1>
    <h2 class="top-card-layout__headline">Principal Reliability Engineer at Northwind Analytics</h2>
    <div class="top-card__subline-item">Gothenburg, Vastra Gotaland County, Sweden</div>
  </section>
  <section class="core-section-container">
    <p class="core-section-container__content">
      Sign in to see who you already know at Northwind Analytics.
    </p>
    <a class="sign-up-modal__outlet" href="/signup">Join now</a>
  </section>
</main>
</body>
</html>
