<!--
  An origin's own 503: a platform saying it cannot serve the request right
  now. It carries no portal marker, and typing it as a local block would
  erase a real platform failure.
-->
<html>
<head><title>503 Service Unavailable</title></head>
<body>
<h1>Service Unavailable</h1>
<p>The server is temporarily unable to service your request.</p>
</body>
</html>
