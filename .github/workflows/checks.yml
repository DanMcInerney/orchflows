# The checks AGENTS.md requires, run on every supported boundary.
#
# Versions: 3.9 is the floor `install.py` enforces via MIN_PYTHON. 3.11 is
# the first release with stdlib `tomllib`, so the two sides of the
# install.py import guard both get exercised. 3.13 is current. 3.10 and
# 3.12 add no distinct code path -- each sits on the same side of that
# guard as a version already here.
#
# Two local checks are deliberately absent. `git diff --check` inspects the
# working tree, which a fresh checkout leaves clean by construction. The
# serial compatibility oracle repeats the regression suite; the parallel
# runner now rejects residue at the module boundary itself. Both stay local.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg reports. A red 3.9 must not hide the state of Windows.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'

    steps:
      # Full history, not the default depth-1: tests/test_cutcheck.py grades
      # oracles inside a scratch clone of a baseline revision, and that clone
      # carries its history from this checkout's, which a one-commit checkout
      # has none of. A depth-1 leg fails every cutcheck case with "cannot clone
      # baseline" while the same suite is green on any developer clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Every case declares its probe as `uv run --no-project python ...`,
      # and the coverage-teeth tests execute those probes for real -- they
      # delete a field from a copy of a case target and require the probe
      # to fail. Without `uv` on PATH they fail as "probe command not
      # found" rather than skipping, which is the correct behavior for a
      # check that cannot run and the reason this step exists. The case's
      # declared command is candidate-facing evidence; CI matches it
      # rather than substituting an interpreter behind its back.
      - uses: astral-sh/setup-uv@v5

      # The suite, sharded one module per child interpreter. Thread
      # parallelism is unsound here -- the suite performs ~30
      # whole-interpreter mutations -- so the runner spawns a process per
      # module and rejects any guarded seam a module leaves dirty. Its
      # TestValidatorAgainstRepo and DryRunOracleTest cases cover the
      # validator and installer dry run without repeating either command.
      - name: python tools/run_tests.py
        run: python tools/run_tests.py
